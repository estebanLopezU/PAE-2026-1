services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: xroad-postgres
    environment:
      POSTGRES_DB: xroad_colombia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
#    ports:
#      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xroad-network

  # Backend API
  backend:
    build:
      context: ./BackendInteroperabilidad
      dockerfile: Dockerfile
    container_name: xroad-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/xroad_colombia
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./BackendInteroperabilidad:/app
    networks:
      - xroad-network

  # Frontend
  frontend:
    build:
      context: ./FrontendInteroperabilidad
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: xroad-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - xroad-network
    restart: unless-stopped

  # PostgreSQL database for GOVStake 360
  govstake-db:
    image: postgres:15-alpine
    container_name: govstake-db
    environment:
      POSTGRES_DB: govstake360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - govstake_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xroad-network

  # GOVStake 360 Backend API
  govstake-backend:
    build:
      context: ./BackendGovstacke
      dockerfile: Dockerfile
    container_name: govstake-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@govstake-db:5432/govstake360
      DEBUG: "false"
    ports:
      - "8002:8002"
    depends_on:
      govstake-db:
        condition: service_healthy
    volumes:
      - ./BackendGovstacke:/app
    networks:
      - xroad-network

networks:
  xroad-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  govstake_data:
    driver: local