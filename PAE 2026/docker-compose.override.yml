services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    environment:
      DEBUG: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # GOVStake 360: replica el modo desarrollo del backend de Interoperabilidad
  # (DEBUG + hot reload) para que ambos microservicios se comporten igual.
  govstake-backend:
    environment:
      DEBUG: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
